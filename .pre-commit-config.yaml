repos:
-   repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
    -   id: black
        language_version: python3.12
-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
    -   id: flake8
        exclude: ^.*migrations/.*$
-   repo: local
    hooks:
    -   id: sync-dev-prompt-overrides
        name: copy prompts.py changes into prompt-overrides/dev.json
        entry: python -m app.core.llm.prompt_overrides sync infrastructure/prompt-overrides/dev.json
        language: system
        files: ^app/core/llm/prompts\.py$
        pass_filenames: false
